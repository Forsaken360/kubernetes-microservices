apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# All namespaced resources below land in this namespace.
namespace: microservices

resources:
- namespace.yaml
- serviceaccount.yaml
- configmap.yaml
- secret.yaml
- api-deployment.yaml
- api-service.yaml
- worker-deployment.yaml
- hpa.yaml
- pdb.yaml
- ingress.yaml
- networkpolicy.yaml
