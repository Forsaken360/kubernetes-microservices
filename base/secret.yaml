# ---------------------------------------------------------------------------
# SECRET TEMPLATE — replace every "replace-me" value before deploying.
# This file intentionally contains no real credentials. In a real setup,
# generate this Secret with external-secrets (Vault / AWS Secrets Manager)
# and do not check secret values into git at all.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  labels:
    app.kubernetes.io/part-of: microservices-demo
type: Opaque
stringData:
  DATABASE_URL: "replace-me://replace-me:replace-me@replace-me:5432/replace-me"
  API_KEY: "replace-me"
